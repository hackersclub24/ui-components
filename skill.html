<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 400px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e5e7eb;

        /* positioning */
        margin: 100px auto;
      }

    <div class="box">
      <h2>About Me</h2>

        I’m a Computer Science student exploring web development and learning

      </p>
