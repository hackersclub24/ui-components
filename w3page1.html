<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .header {
        height: 50px;
        background-color: rgb(0, 0, 0);
        display: flex;
        /* justify-content: center; */
        align-items: center;
        gap: 20px;
        & div {
          height: 100%;
          display: flex;
          /* justify-content: center; */
          align-items: center;
          color: white;
          position: relative;
          & .sub_menu {
            display: none;
            position: absolute;
            top: 100%;
            /* background-color: white; */
            width: 150px;
            background-color: white;
            color: black;
            list-style: none;
            gap: 10px;
            padding: 20px 20px;
            /* margin: 15px 0px; */
          }
          &:hover {
            cursor: pointer;
            background-color: #d4d3e0;
            & .sub_menu {
              display: flex;
              flex-direction: column;
              /* position: relative; */
            }
          }
        }
      }
      .search {
        margin-left: auto;
        /* & :hover{                    for some reason this is not working
          background-color: red;
        } */
      }
      .header > div.search:hover {
        background-color: red;
      }

      .img-container {
        width: 100%;
        /* max-width: 600px; */
        height: 640px;
        background-image: url("https://www.w3schools.com/w3images/chicago.jpg");
        background-size: cover;
        /* background-position: center; */
        position: relative;
        /* margin: 20px auto; */
        display: flex;
        flex-direction: column;
      }

      #chicago {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 25px;
        font-family: "Montserrat", sans-serif;

        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      #bottom-line {
        position: absolute;
        bottom: 30px;
        font-family: "Montserrat", sans-serif;

        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 25px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      .t-shirt {
        padding: 64px 16px;
        & div {
          font-family: "Montserrat", sans-serif;
          display: flex;
          /* flex-direction: column; */
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div>HOME</div>
      <div>BAND</div>
      <div>TOUR</div>
      <div>CONTACT</div>
      <div>
        <span>MORE</span
        ><svg
          fill="#fff"
          width="30px"
          height="12px"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M11.178 19.569a.998.998 0 0 0 1.644 0l9-13A.999.999 0 0 0 21 5H3a1.002 1.002 0 0 0-.822 1.569l9 13z"
            ></path>
          </g>
        </svg>
        <ul class="sub_menu">
          <li>Merchandise</li>
          <li>Extras</li>
          <li>Media</li>
        </ul>
      </div>
      <div class="search">
        <svg
          width="64px"
          height="20px"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g
            id="SVGRepo_tracerCarrier"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></g>
          <g id="SVGRepo_iconCarrier">
            <path
              d="M16.6725 16.6412L21 21M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
          </g>
        </svg>
      </div>
    </div>
    <section>
      <div class="img-container">
        <p id="chicago">Chicago</p>
        <p id="bottom-line">Thank you, Chicago - A night we won't forget.</p>
      </div>
    </section>
    <section class="t-shirt">
      <div><p>THE BAND</p></div>
      <div><p>heelo</p></div>
    </section>
  </body>
</html>
